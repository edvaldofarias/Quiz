<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Teste Firebase Auth → .NET API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    .row { margin-bottom: 12px; }
    label { display:block; margin-bottom: 4px; font-weight: 600; }
    input, button, textarea { padding: 8px; font-size: 14px; }
    textarea { width: 100%; height: 160px; }
    pre { background: #f6f8fa; padding: 12px; overflow: auto; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Login Firebase → Teste no Backend</h1>

  <div class="row">
    <button id="btnGoogle">Login com Google</button>
    <span class="muted">Habilite o provedor Google no Firebase Console.</span>
  </div>

  <div class="row">
    <label for="email">Email (para login com email/senha)</label>
    <input id="email" type="email" placeholder="usuario@exemplo.com"/>
  </div>
  <div class="row">
    <label for="password">Senha</label>
    <input id="password" type="password" placeholder="******"/>
  </div>
  <div class="row">
    <button id="btnEmailSenha">Login com Email/Senha</button>
    <span class="muted">Ative "Email/Password" no Firebase Console.</span>
  </div>

  <div class="row">
    <button id="btnRefresh">Atualizar Token</button>
    <button id="btnCopy">Copiar Token</button>
    <button id="btnLogout">Logout</button>
  </div>

  <div class="row">
    <label for="token">ID Token (JWT)</label>
    <textarea id="token" readonly placeholder="Faça login para ver o token"></textarea>
  </div>

  <div class="row">
    <button id="btnCallApi">Chamar /me no backend</button>
  </div>
  <div class="row">
    <label>Resposta do backend</label>
    <pre id="apiOut" class="muted">(sem chamada ainda)</pre>
  </div>

  <div class="row">
    <label>Usuário logado (claims básicas)</label>
    <pre id="userOut" class="muted">(não autenticado)</pre>
  </div>

  <script type="module">
    // SDKs Firebase v12 (modular)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    // === CONFIGURE SUA API AQUI ===
    const BACKEND_URL = "https://localhost:5107/"; // ajuste para sua API (ex.: https://api.seudominio.com/me)

    // Mesmo config que você já adicionou
    const firebaseConfig = {
      apiKey: "AIzaSyAqSdrXDyBsajsKGUslgkWotwRP7n4XZh8",
      authDomain: "quiz-edvaldofarias.firebaseapp.com",
      projectId: "quiz-edvaldofarias",
      storageBucket: "quiz-edvaldofarias.firebasestorage.app",
      messagingSenderId: "210993528654",
      appId: "1:210993528654:web:497c47a9263e6058b6681f",
      measurementId: "G-ZD5M8DJ9HN"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // UI refs
    const $email = document.getElementById("email");
    const $password = document.getElementById("password");
    const $token = document.getElementById("token");
    const $apiOut = document.getElementById("apiOut");
    const $userOut = document.getElementById("userOut");

    const $btnGoogle = document.getElementById("btnGoogle");
    const $btnEmailSenha = document.getElementById("btnEmailSenha");
    const $btnRefresh = document.getElementById("btnRefresh");
    const $btnCopy = document.getElementById("btnCopy");
    const $btnLogout = document.getElementById("btnLogout");
    const $btnCallApi = document.getElementById("btnCallApi");

    // Helpers
    async function getIdTokenOrEmpty(forceRefresh = false) {
      const user = auth.currentUser;
      if (!user) return "";
      return await user.getIdToken(forceRefresh);
    }

    async function updateUI(user) {
      if (!user) {
        $userOut.textContent = "(não autenticado)";
        $token.value = "";
        return;
      }
      const token = await getIdTokenOrEmpty(false);
      $token.value = token;

      // Exibe claims principais
      const idTokenResult = await user.getIdTokenResult();
      const info = {
        uid: user.uid,
        email: user.email,
        displayName: user.displayName,
        providerId: user.providerData?.[0]?.providerId,
        claims: idTokenResult.claims
      };
      $userOut.textContent = JSON.stringify(info, null, 2);
    }

    // Observa mudanças de login
    onAuthStateChanged(auth, async (user) => {
      await updateUI(user);
    });

    // Ações
    $btnGoogle.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
        // onAuthStateChanged cuidará do restante
      } catch (err) {
        alert("Erro no login Google: " + (err?.message || err));
      }
    });

    $btnEmailSenha.addEventListener("click", async () => {
      try {
        const email = $email.value.trim();
        const password = $password.value;
        if (!email || !password) {
          alert("Informe email e senha.");
          return;
        }
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert("Erro no login email/senha: " + (err?.message || err));
      }
    });

    $btnRefresh.addEventListener("click", async () => {
      try {
        const token = await getIdTokenOrEmpty(true); // força refresh
        if (!token) {
          alert("Faça login primeiro.");
          return;
        }
        $token.value = token;
      } catch (err) {
        alert("Erro ao atualizar token: " + (err?.message || err));
      }
    });

    $btnCopy.addEventListener("click", async () => {
      if (!$token.value) { alert("Nada para copiar."); return; }
      await navigator.clipboard.writeText($token.value);
      alert("Token copiado para a área de transferência.");
    });

    $btnLogout.addEventListener("click", async () => {
      await signOut(auth);
    });

    $btnCallApi.addEventListener("click", async () => {
      try {
        const token = await getIdTokenOrEmpty(false);
        if (!token) { alert("Faça login primeiro."); return; }

        const res = await fetch(BACKEND_URL, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        const text = await res.text();
        // tenta parsear JSON, senão exibe texto
        try {
          $apiOut.textContent = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
          $apiOut.textContent = text;
        }
      } catch (err) {
        $apiOut.textContent = "Erro na chamada: " + (err?.message || err);
      }
    });
  </script>
</body>
</html>
