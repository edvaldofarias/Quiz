<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link href="css/style.css" rel="stylesheet" type="text/css"/>
		
        <!-- Scripts -->
        <script src="scripts/jquery.min.js" type="text/javascript"></script>
        <script src="Data/Questoes.js" type="text/javascript"></script>
        <!--<script src="scripts/cookie.js" type="text/javascript"></script>>-->
        <script src="scripts/pergunta/script.js" type="text/javascript"></script>
        <!--\ Scripts -->

        
		
        <!-- Bootstrap -->
        <link href="bootstrap/bootstrap.css" rel="stylesheet" type="text/css"/>
        <script src="bootstrap/bootstrap.min.js" type="text/javascript"></script>
        <!-- /Bootstrap -->
        <title>Perguntas</title>
    </head>
    <body style="background: #fafafa;">
        <div class="container" style="background: #fafafa;">
            <div class="row">
                <div class="col-sm-8 text-left">
                    <br><br><br>
                    <div style="font-size: 35px; color: #14738C; font-weight: bold;">
                        Questões: 
                        <i><span style="font-family: 'Roboto';color: #199BBE;" id="materia"></span></i> 
                    </div> 
                </div>
                <div class="col-sm-4 text-right">
                    <img src="img/questoes.png" alt="imagens" style="width: 60%;"/>
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-sm-6 text-left">Questão atual: <code id="qAtual">1/30</code> Questão certa: <code id="resultado">3</code></div>
                <div class="col-sm-6 text-right">
                    Tempo restante: <code id="tempo">60</code> segundos
                </div>
            </div>
            <hr>
            <div id="pergunta">
                <p id="question" class="text-justify"></p>
                <hr>
                <div id="resposta">
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-md-4 text-left">
                    <button class="btn" id="desistir" style="background-color: #BE0000; color: white;">
						<img src="img/desistir.png" alt="imagens" style="width: 20%;"/>
                        Desistir
                    </button>
                </div>
                <div class="col-md-4 text-center">
                    <button class="btn" id="pula" style="background-color: #14738C; color: white;">
						<img src="img/pular.png" alt="imagens" style="width: 20%;"/>
                        Pular
                    </button>
                </div>
                <div class="col-md-4 text-right">
                    <button class="btn" id="avanca" disabled style="background-color: #d6d7e5; color: white;">
						<img src="img/avancar.png" alt="imagens" style="width: 15%;"/>
                        Avançar
                    </button>
                </div>
            </div>
        </div>
		<br>
    </body>
</html>
